[project]
name = "djx"
version = "0.1.0"
description = "Terminal UI that explores a Django + Django Ninja project and jumps to code in Zed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "django-ninja", "tui", "textual", "zed"]
requires-python = ">=3.12"
dependencies = ["textual"]

[project.urls]
Homepage = "https://github.com/Carnage725/djx"
Issues = "https://github.com/Carnage725/djx/issues"

[project.scripts]
djx = "djx.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "django",
    "django-ninja",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djx", "src/djx_engine"]

[tool.ruff]
line-length = 100
src = ["src", "sandbox"]
extend-exclude = ["sandbox/*/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30  # a hung UI test must fail, not freeze the run
testpaths = ["tests"]

[tool.ruff.lint]
# Textual declares BINDINGS and CSS as plain class attributes.
extend-ignore = ["RUF012"]
