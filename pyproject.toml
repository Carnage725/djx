[project]
name = "djx"
version = "0.1.0"
description = "Terminal UI that explores a Django + Django Ninja project and jumps to code in Zed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual"]

[project.scripts]
djx = "djx.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "django", "django-ninja"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djx", "src/djx_engine"]

[tool.ruff]
line-length = 100
src = ["src", "sandbox"]
extend-exclude = ["sandbox/*/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
